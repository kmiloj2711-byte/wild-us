/* WILD//US NATIONAL ATLAS — region explorer extension */
.atlas-grid {display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.atlas-region {border:1px solid #D3E4D7;border-radius:19px;padding:17px;min-height:164px;text-align:left;background:#fff;position:relative;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;gap:8px;align-items:flex-start;transition:transform .16s,box-shadow .16s}
.atlas-region:focus-visible,.atlas-mode:focus-visible{outline:3px solid #459C65;outline-offset:2px}
.atlas-region:hover{transform:translateY(-3px);box-shadow:0 12px 32px #12362119}
.atlas-region .atlas-emoji{font-size:33px;line-height:1.1}
.atlas-region .atlas-number{position:absolute;right:14px;top:9px;opacity:.14;font-size:47px;font-weight:950}
.atlas-region strong{font-size:16px;line-height:1.2;color:#213E2C}
.atlas-region small{font-size:11px;color:#668373;line-height:1.4}
.atlas-region .atlas-arrow{margin-top:auto;border-radius:100px;background:#E6F6D7;color:#3E6D33;padding:4px 10px;font-size:10px;font-weight:900}
.atlas-featured{background:#E4F5CF;border-color:#A6D08F}
.atlas-hero{border-radius:20px;padding:22px;color:#fff;margin-bottom:18px;position:relative;overflow:hidden;background:linear-gradient(130deg,var(--atlas-color),#142D22)}
.atlas-hero h2{color:#fff;font-size:30px;margin:8px 0 3px}
.atlas-hero p{color:#F3FBF2;font-size:14px;max-width:620px}
.atlas-hero .large-emoji{font-size:40px}
.atlas-tabbar{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:17px}
.atlas-mode{border:1px solid #DBE4DC;border-radius:999px;background:#F6F8F3;color:#30513D;font-size:12px;font-weight:800;padding:9px 13px;cursor:pointer}
.atlas-mode.active{background:#244F37;color:#fff;border-color:#244F37}
.atlas-species{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.atlas-species-card{padding:12px;border-radius:13px;background:#F2F7EE;border:1px solid #DFEADB;display:flex;flex-direction:column;gap:3px}
.atlas-species-card b{font-size:13px;color:#22422F}
.atlas-species-card em{color:#637767;font-size:10px}
.atlas-species-card span{color:#42604D;font-size:11px}
.atlas-panel{border:1px solid #DCE8DE;border-radius:15px;padding:14px;margin-bottom:10px;background:#F7FBF5}
.atlas-panel b{color:#244A34}
.atlas-panel p{font-size:13px;color:#415847;margin-top:6px}
.atlas-quiz-option{display:block;width:100%;border-radius:12px;background:#F8FAF6;border:1px solid #D8E4D6;text-align:left;padding:12px 14px;margin:7px 0;color:#253C2E;cursor:pointer;font-weight:700}
.atlas-quiz-option:disabled{opacity:.82;cursor:default}
.atlas-foot{font-size:11px!important;color:#667C6B!important;line-height:1.5}
@media(max-width:1050px){.atlas-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:540px){.atlas-grid{grid-template-columns:1fr}.atlas-species{grid-template-columns:1fr}.atlas-hero{padding:16px}.atlas-hero h2{font-size:25px}}


/* WILD//US interactive offline geographic atlas */
.usmap-wrap{margin:13px 0 24px;border:1px solid #cadfd0;border-radius:25px;background:#f9fcf4;box-shadow:0 15px 44px #1e4c3210;overflow:hidden}
.usmap-intro{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;flex-wrap:wrap;padding:22px 24px 8px}
.usmap-intro h2{font-size:clamp(25px,3vw,36px);margin:5px 0}.usmap-intro p{max-width:750px;color:#587467;font-size:13px}
.usmap-label{display:inline-flex;gap:7px;align-items:center;font-size:10px;font-weight:900;letter-spacing:.13em;color:#388269}
.usmap-guide{font-size:11px;font-weight:800;background:#e8f5e0;color:#365941;border-radius:999px;padding:8px 12px;white-space:nowrap}
.usmap-scroll{overflow-x:auto;overscroll-behavior-x:contain;margin:0 12px;scrollbar-width:thin}
.usmap-stage{min-width:740px;position:relative;isolation:isolate;aspect-ratio:1200/880;width:100%;margin:auto}
.us-map-graphic{display:block;width:100%;height:100%}
.us-map-inset-title{font-size:15px;fill:#355d49;font-weight:900;letter-spacing:2px}
.usmap-pin{position:absolute;z-index:3;transform:translate(-50%,-50%);display:grid;place-items:center;border:3px solid white;box-shadow:0 4px 0 #16483455,0 6px 19px #0b3f4080;border-radius:999px;width:36px;height:36px;background:#1c704a;color:white;font-weight:950;font-size:11px;line-height:1;cursor:pointer;transition:transform .15s,background .15s,box-shadow .15s}
.usmap-pin[data-active="1"]{background:#c5eb65;color:#183c28;box-shadow:0 3px 0 #5f984f,0 0 0 7px #d8faaf88,0 8px 26px #275d4266}
.usmap-pin:is(:hover,:focus-visible){z-index:10;background:#e9fb94;color:#193a24;transform:translate(-50%,-50%) scale(1.16);box-shadow:0 0 0 5px #fff9,0 8px 23px #335c4870}
.usmap-pin::after{content:attr(data-label);pointer-events:none;position:absolute;display:block;left:50%;bottom:43px;transform:translateX(-50%) translateY(5px);background:#123b29;color:white;padding:9px 12px;border-radius:11px;max-width:205px;min-width:130px;width:max-content;opacity:0;visibility:hidden;transition:.16s;font-size:12px;line-height:1.2;box-shadow:0 8px 22px #1b3f3440;z-index:15}
.usmap-pin:is(:hover,:focus-visible)::after{opacity:1;visibility:visible;transform:translateX(-50%) translateY(0)}
.usmap-info{display:flex;gap:12px;flex-wrap:wrap;justify-content:space-between;align-items:center;padding:13px 22px 20px}
.usmap-info p{font-size:12px;color:#577061;max-width:780px}
.usmap-legend{display:flex;align-items:center;gap:7px;font-size:11px;font-weight:750;color:#355947;white-space:nowrap}
.usmap-dot{width:12px;height:12px;border-radius:50%;background:#216b4e;border:2px solid white;box-shadow:0 0 0 1px #91ac8b}
.usmap-index{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;padding:0 20px 22px}
.usmap-index button{text-align:left;display:flex;align-items:center;gap:10px;min-width:0;background:#fff;border:1px solid #d9e7da;border-radius:12px;padding:11px;cursor:pointer;transition:background .14s,transform .14s}
.usmap-index button:hover{background:#ebf9de;transform:translateY(-1px)}
.usmap-index b{font-size:11px;color:#43735b;background:#e7f5e5;border-radius:9px;min-width:29px;padding:6px;text-align:center}
.usmap-index span{font-size:11px;font-weight:850;line-height:1.25}
.usmap-index button:first-child{background:#e8f8d9;border-color:#b6d7a6}
@media(max-width:960px){.usmap-index{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:600px){.usmap-intro{padding:18px 17px 6px}.usmap-index{grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;padding:0 13px 16px}.usmap-index button{padding:8px;gap:5px}.usmap-index span{font-size:10px}.usmap-info{padding:9px 15px 15px}.usmap-pin{width:33px;height:33px}.usmap-wrap{margin-top:10px}.usmap-scroll{margin:0 6px}}

/* WILD//US - QA Stage 2. AI-assisted prototype for review, not student-authored code.
 * Arrows for feeding: a (food/prey) -> b (consumer/predator).
 * Arrows for habitat: a (habitat provider) -> b (beneficiary).
 * All inferred effects are conditional teaching hypotheses, never measured populations.
 */
(function (root, factory) {
  const api = factory();
  if (typeof module === 'object' && module.exports) module.exports = api;
  if (root) root.WildCascade = api;
})(typeof window !== 'undefined' ? window : null, function () {
  'use strict';

  function interpretation(current, link) {
    const type = link.type === 'trophic' ? 'feeding' : link.type;
    if (type === 'feeding') {
      if (current.id === link.a) {
        return current.direction < 0
          ? {direction: -1, status: 'Food Availability May Decline', reason: 'A possible reduction in a food resource could place pressure on its consumer.'}
          : {direction: 1, status: 'Food Availability May Increase', reason: 'More food may become available, but consumer abundance does not necessarily rise.'};
      }
      if (current.id === link.b) {
        return current.direction < 0
          ? {direction: 1, status: 'Predation Release Possible', reason: 'Less predator pressure could benefit this prey, depending on other predators and conditions.'}
          : {direction: -1, status: 'Predation Pressure May Increase', reason: 'Increased predator presence may raise predation pressure on this prey.'};
      }
    }
    if (type === 'habitat' && current.id === link.a) {
      return current.direction < 0
        ? {direction: -1, status: 'Habitat Support May Decline', reason: 'Reduced habitat provision could affect organisms that use that habitat.'}
        : {direction: 1, status: 'Habitat Support May Improve', reason: 'More habitat support may help, but does not guarantee population growth.'};
    }
    return null; // Beneficiary -> habitat provider is NOT a causal direction.
  }

  function propagateCascade(targetId, action, links, options = {}) {
    const {species = [], maxDepth = 2} = options;
    if (typeof targetId !== 'string' || !targetId.trim()) throw new Error('Species ID required');
    if (!['remove', 'reduce', 'introduce'].includes(action)) throw new Error('Unsupported action');
    if (!Array.isArray(links)) throw new Error('Links must be an array');
    if (!Number.isInteger(maxDepth) || maxDepth < 0 || maxDepth > 2) throw new Error('Depth must be 0, 1, or 2');
    if (!Array.isArray(species)) throw new Error('Species must be an array');
    const names = new Map(species.map(s => [s.id, s]));
    if (species.length && !names.has(targetId)) throw new Error('Unknown target species');
    if (action === 'introduce') {
      const organism = names.get(targetId);
      if (targetId !== 'python' && (!organism || organism.status !== 'Invasive')) {
        throw new Error('Introduce only applies to an invasive organism in this teaching model');
      }
    }
    const validLinks = links.filter(l => l && typeof l.a === 'string' && typeof l.b === 'string' &&
      (l.type === 'feeding' || l.type === 'trophic' || l.type === 'habitat') &&
      l.certainty !== 'provisional' && (!species.length || (names.has(l.a) && names.has(l.b))));
    const visitedSpecies = new Set([targetId]);
    const impacts = [];
    let frontier = [{id: targetId, direction: action === 'introduce' ? 1 : -1, path: [targetId]}];

    for (let depth = 1; depth <= maxDepth && frontier.length > 0; depth++) {
      const candidates = new Map();
      for (const current of frontier) {
        if (!current.direction) continue; // Conflicting causal paths never propagate onward.
        for (const link of validLinks) {
          if (link.a !== current.id && link.b !== current.id) continue;
          const neighborId = link.a === current.id ? link.b : link.a;
          if (visitedSpecies.has(neighborId)) continue; // Avoid cycles and reprocessing.
          const finding = interpretation(current, link);
          if (!finding) continue;
          const source = names.get(current.id)?.name || current.id;
          const neighbor = names.get(neighborId)?.name || neighborId;
          const candidate = {
            ...finding,
            sourceId: current.id,
            why: `${source} → ${neighbor}: ${finding.reason}`,
            relation: link.type,
            supportingLink: link.why || 'Relationship listed in the teaching dataset.',
            sourceStatus: link.sourceUrl ? 'Relationship source linked (not independently audited)' : 'Primary scientific citation pending',
            path: current.path.concat([neighborId])
          };
          if (!candidates.has(neighborId)) candidates.set(neighborId, []);
          candidates.get(neighborId).push(candidate);
        }
      }
      const next = [];
      for (const [id, alternatives] of candidates) {
        const mixed = new Set(alternatives.map(x => x.direction)).size > 1;
        const direction = mixed ? 0 : alternatives[0].direction;
        const impact = {
          id, depth, direction,
          status: mixed ? 'Mixed / Uncertain Effects' : alternatives.length > 1 ? 'Multiple Possible Effects' : alternatives[0].status,
          evidenceType: 'Educational Simulation',
          why: mixed
            ? 'This organism has competing model pathways. No net population direction can be inferred.'
            : alternatives[0].reason,
          pathways: alternatives,
          assumption: depth === 2
            ? 'Second-degree possibility: assumes the first-degree effect changes abundance; not demonstrated.'
            : 'First-degree possibility: diet flexibility and environmental conditions may alter outcomes.'
        };
        visitedSpecies.add(id);
        impacts.push(impact);
        if (direction !== 0) next.push({id, direction, path: alternatives[0].path});
      }
      frontier = next;
    }
    return {
      targetId, action, maxDepth,
      impacts,
      visitedSpecies: [...visitedSpecies],
      excludedProvisional: links.filter(l => l && l.certainty === 'provisional').length,
      disclaimer: 'Model-generated conditional possibilities, not measured abundance or predictions. Source-by-source scientific verification is pending.'
    };
  }
  return {propagateCascade};
});

function leadForCascadePath(path, impactedId){
  const idx=D.links.findIndex(link =>
    link.type===path.relation &&
    ((link.a===path.sourceId && link.b===impactedId) ||
     (link.b===path.sourceId && link.a===impactedId))
  );
  return idx >= 0 ? CASCADE_SOURCE_LEADS[idx] : null;
}
function cascadeLab(){
  const result=ui.cascadeResult;
  const target=sp(ui.cascadeTarget);
  const tab=ui.cascadeTab==='sources'?'sources':'model';
  const organisms=D.species.slice(0,10);
  const actions=ui.cascadeTarget==='python'?[['reduce','Reduce population'],['remove','Remove (hypothetical)'],['introduce','Introduce invasive python']]:[['reduce','Reduce population'],['remove','Remove (hypothetical)']];
  const options=organisms.map(s=>`<option value="${esc(s.id)}" ${s.id===ui.cascadeTarget?'selected':''}>${esc(s.name)}</option>`).join('');
  const selectAction=actions.map(([id,label])=>`<option value="${id}" ${id===ui.cascadeAction?'selected':''}>${esc(label)}</option>`).join('');
  const tabs=result?`<div class="cascade-tabs" role="group" aria-label="Cascade explanation type"><button class="chip ${tab==='model'?'active':''}" data-action="cascadeTab" data-id="model" aria-pressed="${tab==='model'}">⚙ Educational model</button><button class="chip ${tab==='sources'?'active':''}" data-action="cascadeTab" data-id="sources" aria-pressed="${tab==='sources'}">🔬 Relationship evidence leads</button></div>`:'';
  const cards=!result?'<p class="muted">Choose an organism and perturbation, then run a two-link conditional exploration.</p>':
    result.impacts.length?result.impacts.map(impact=>{
      const inner=tab==='model'
        ? `<div class="micro muted">Distance ${impact.depth} link(s) · ⚙ Educational Simulation</div><p class="micro" style="margin:6px 0">${esc(impact.why)}</p><p class="micro muted">${esc(impact.assumption)}</p><details><summary>Inspect pathways</summary>${impact.pathways.map(path=>`<p class="micro muted">${esc(path.why)} (${esc(path.relation)})</p>`).join('')}</details>`
        : `<div class="micro muted">These are research leads, NOT verified citations for a specific ecological effect.</div>${impact.pathways.map(path=>{const lead=leadForCascadePath(path,impact.id);return `<div class="cascade-evidence"><p class="micro"><b>Relationship:</b> ${esc(path.supportingLink)}</p>${lead?`<p class="micro"><b>Candidate source ${esc(lead.id)}:</b> <a href="${esc(lead.url)}" target="_blank" rel="noopener noreferrer">${esc(lead.title)} ↗</a></p><p class="micro"><b>Verification status:</b> pending independent review. ${esc(lead.limit)}</p>`:'<p class="micro"><b>Verification status:</b> source not mapped; do not claim this as documented.</p>'}<p class="micro muted">The predicted response remains a model inference regardless of how well the underlying feeding relationship is documented.</p></div>`}).join('')}`;
      return `<div class="connection-row cascade-row"><div style="min-width:0;flex:1"><b>${esc(sp(impact.id)?.name||impact.id)} · ${esc(impact.status)}</b>${inner}</div><span class="status-tag ${impact.direction<=0?'warn':''}">${impact.direction===0?'?':impact.direction<0?'↓ possible':'↑ possible'}</span></div>`;
    }).join(''):
    '<p class="muted">No eligible two-link impacts found. This is not evidence that the real species has no ecological effects.</p>';
  return `<section class="card cascade-lab" id="cascade-lab" aria-label="Dynamic cascade experiment"><div class="soft-label">QA STAGE 3 · INTERACTIVE EXPERIMENT</div><h2 style="margin:9px 0">Change one species. Explore the connections.</h2><p class="muted">Possible mechanisms within two ecological connections. Not a forecast or measured health index.</p><div class="cascade-controls"><label>Organism<select id="cascade-species" aria-label="Species to alter" data-cascade-field="species">${options}</select></label><label>Perturbation<select id="cascade-action" aria-label="Ecological change" data-cascade-field="action">${selectAction}</select></label><button class="btn dark" data-action="cascadeRun">Run cascade ↗</button><button class="btn light" data-action="cascadeClear">Reset</button></div>${tabs}<div aria-live="polite">${result?`<p><strong>Experiment:</strong> ${esc(target?.name||ui.cascadeTarget)} · ${esc(result.action)} · ${result.impacts.length} organisms with possible responses</p>`:''}${cards}</div><p class="footerhint"><b>Integrity notice:</b> links are curated educational proposals awaiting article-level checking. A plausible causal path is not a measured population response. Mixed pathways produce no net direction. Provisional links are excluded.</p></section>`;
}

 if(attempt>=3&&!practice){toast('All three scored attempts used. Practice mode remains available.');return}
 const pool=base.slice();
 if(practice){for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}}
 const selected=practice?pool.slice(0,6):pool.slice(attempt*6,attempt*6+6);
 if(selected.length!==6||selected.some(q=>!Array.isArray(q)||q.length<4||!Array.isArray(q[1]))){toast('Quiz questions unavailable.');return}
 ui.quizSession={bank:id,practice,questions:selected,index:0,selected:null,correct:0,answers:[]};

}

 <button class="btn danger sm" data-action="researchDelete" data-index="${i}">Delete</button></div></div>`).join(''):'<div class="empty">Your research questions belong here.</div>'}</div><div class="divider"></div><h3>What makes an investigation fair?</h3><p class="muted micro" style="margin-top:8px">Use repeatable methods, record actual observations, describe controls, and acknowledge uncertainty. A small sample or a simulation alone cannot prove a broad ecological effect.</p><div class="callout" style="margin-top:16px">🔬 Field science starts with observation. Use this lab alongside your Field Journal.</div></div></div>`}

function handleClick(e){const el=e.target.closest('[data-action]');if(!el)return;const action=el.dataset.action,id=el.dataset.id;const idx=Number(el.dataset.index);if(action==='close'&&el.classList.contains('overlay')&&e.target!==el)return;

 return `<section class="usmap-wrap" aria-label="Interactive geographic map of the 12 WILD US educational regions"><div class="usmap-intro"><div><div class="usmap-label">🌎 FIELD ATLAS / WHERE ARE WE?</div><h2>Tap a place. Discover its world.</h2><p>Find all 12 learning regions on the U.S. map. Select a numbered marker to explore the habitats, wildlife and conservation mission of that region.</p></div><span class="usmap-guide">12 regions · ${NATIONAL_ATLAS.reduce((total,region)=>total+region.species.length,0)} organism entries</span></div><div class="usmap-scroll" role="region" tabindex="0" aria-label="United States map; scroll horizontally on small screens"><div class="usmap-stage">${NATIONAL_MAP_SVG}${pins}</div></div><div class="usmap-mobile-controls"><button type="button" data-action="atlasMapPan" data-dir="left" aria-label="Pan map west">← West</button><strong>Swipe to explore ↔</strong><button type="button" data-action="atlasMapPan" data-dir="right" aria-label="Pan map east">East →</button></div><div class="usmap-info"><p>📍 Numbers mark <b>representative areas</b>, not official ecosystem borders. Alaska, Hawaii and Puerto Rico use map insets; other Pacific islands are included in the regional guide but not drawn to scale.</p><div class="usmap-legend"><span class="usmap-dot"></span> Tap a numbered marker</div></div><div class="usmap-index" aria-label="Regional map index">${index}</div></section>`;
}

    <div class="atlas-tabbar" role="group" aria-label="Region exploration sections">${[['discover','Discover'],['connect','Connect'],['care','Care'],['conserve','Conserve'],['quiz','Mini challenge']].map(([t,n])=>`<button class="atlas-mode ${tab===t?'active':''}" data-action="atlasTab" data-id="${r.id}" data-tab="${t}">${n}</button>`).join('')}</div>`;
  if(tab==='discover'){
    html+=`<h3>Habitats to explore</h3><div class="chip-group" style="margin-bottom:15px">${r.habitats.map(h=>`<span class="chip" style="pointer-events:none">${esc(h)}</span>`).join('')}</div><h3>${r.species.length} featured organisms</h3><p class="muted" style="font-size:12px;margin-bottom:10px">Featured in the larger region; these organisms do not necessarily share the same local habitat.</p><div class="atlas-species">${r.species.map(s=>`<div class="atlas-species-card"><b>${esc(s.common)}</b><em>${esc(s.scientific)}</em><span>${esc(s.role)}</span></div>`).join('')}</div><div class="atlas-panel" style="margin-top:15px"><b>🔎 WildGuess — ${esc(r.wildguess)}</b><p>${esc(r.wildclue)}</p><p class="atlas-foot">A sample clue for a future regional WildGuess collection.</p></div>`;
  }

  if(tab==='care')html+=`<h3>What puts this region at risk?</h3>${r.risks.map((x,i)=>`<div class="atlas-panel"><b>⚠️ Threat ${i+1}</b><p>${esc(x)}</p></div>`).join('')}<div class="atlas-panel"><b>Investigation prompt</b><p>Which threat could affect several habitats, and what observations would help measure its impact?</p></div>`;
  if(tab==='conserve')html+=`<h3>${esc(r.journey)}</h3><p>${esc(r.mission)}</p><div class="atlas-panel"><b>Conservation decision</b><p>${esc(r.decision)}</p></div><div class="atlas-panel"><b>Why this matters</b><p>${esc(r.why)}</p></div><div class="atlas-panel"><b>Your reflection</b><p>What evidence would you need before recommending this action? How would you tell whether it worked?</p></div><p class="atlas-foot">This is a mini-journey guide, not an executable ecological intervention model. Complete the fully interactive Conservation Journey in Florida.</p>`;
  if(tab==='quiz')html+=atlasQuizMarkup(r);
  html+=`<div class="atlas-panel" style="margin-top:16px"><b>Scientific source check</b><p>${esc(r.sources.join(' · '))}</p><p class="atlas-foot">Agency names indicate suggested places to check facts; they are not citations to a specific publication. Verify species ranges and interactions before publishing as reviewed scientific content.</p></div></article></div>`;
  modal.innerHTML=html;
  const article=modal.querySelector('.modal');if(article)article.scrollTop=0;
}
function atlasQuestions(r){
 const index=NATIONAL_ATLAS.indexOf(r);
 const other=NATIONAL_ATLAS.filter(x=>x.id!==r.id);
 const s=r.species[(index+2)%r.species.length];
 const bad1=other[(index+3)%other.length].species[0].common;
 const bad2=other[(index+6)%other.length].species[1].common;
 const badH1=other[(index+2)%other.length].habitats[0];
 const badH2=other[(index+5)%other.length].habitats[1];
 const badT1=other[(index+3)%other.length].risks[0];
 const badT2=other[(index+6)%other.length].risks[1];
 // Each prompt explicitly asks about the *guide's featured set*: this does not
 // imply that distractors cannot occur elsewhere in the broader geographic region.
 return [
 {q:'Which organism appears in this expedition’s featured set?',choices:[s.common,bad1,bad2],answer:0,why:`${s.common} is one of the organisms highlighted by this guide.`},
 {q:'Which habitat is explicitly featured in this expedition guide?',choices:[badH1,r.habitats[0],badH2],answer:1,why:`${r.habitats[0]} is one of the habitats in this educational region.`},
 {q:'Which conservation threat is highlighted by this expedition?',choices:[badT1,badT2,r.risks[0]],answer:2,why:`${r.risks[0]} is a challenge highlighted in this region. Threats can overlap geographically.`}
 ];
}
function atlasQuizMarkup(r){
 const qz=atlasQuestions(r);
 if(atlasSession.finished){let percent=Math.round(atlasSession.correct/3*100);return `<div class="atlas-panel"><h3>Challenge complete · ${percent}%</h3><p>${atlasSession.correct} of 3 correct. This is an ungraded mini-practice, not the official three-attempt Biology Academy assessment.</p><button class="btn primary" data-action="atlasRetry" data-id="${r.id}">Practice again ↻</button></div><p class="atlas-foot">For formal region assessment, author and review an 18-question item bank: 6 new questions on each of three attempts.</p>`}
 const q=qz[atlasSession.step];
 let html=`<div class="atlas-panel"><div class="soft-label">FIELD PRACTICE · QUESTION ${atlasSession.step+1}/3</div><h3>${esc(q.q)}</h3></div>`;
 html+=q.choices.map((x,i)=>`<button class="atlas-quiz-option" data-action="atlasAnswer" data-id="${r.id}" data-index="${i}" ${atlasSession.selected!==null?'disabled':''}>${String.fromCharCode(65+i)}. ${esc(x)}</button>`).join('');
 if(atlasSession.selected!==null){html+=`<div class="atlas-panel"><b>${atlasSession.selected===q.answer?'✓ Correct':'Not quite'}</b><p>${esc(q.why)}</p></div><button class="btn primary" data-action="atlasNext" data-id="${r.id}">${atlasSession.step===2?'See result':'Next question'} →</button>`}
 return html;
}
// Existing click handler ignores these new atlas actions; the dedicated handler

document.addEventListener('click',e=>{
 const el=e.target.closest('[data-action]');if(!el)return;
 const a=el.dataset.action,id=el.dataset.id;
 if(a==='atlasRegion'){atlasSession.step=0;atlasSession.selected=null;atlasSession.correct=0;atlasSession.finished=false;atlasOpen(id);sound('click')}
 if(a==='atlasTab'){if(el.dataset.tab==='quiz'&&atlasSession.region!==id){atlasSession.step=0;atlasSession.correct=0;atlasSession.selected=null;atlasSession.finished=false}atlasOpen(id,el.dataset.tab);sound('click')}
 if(a==='atlasAnswer'&&atlasSession.selected===null){const i=Number(el.dataset.index),q=atlasQuestions(atlasFind(id))[atlasSession.step];atlasSession.selected=i;if(i===q.answer)atlasSession.correct++;sound(i===q.answer?'correct':'wrong');atlasOpen(id,'quiz')}
 if(a==='atlasNext'){if(atlasSession.step>=2)atlasSession.finished=true;else{atlasSession.step++;atlasSession.selected=null}atlasOpen(id,'quiz')}
 if(a==='atlasRetry'){atlasSession.step=0;atlasSession.selected=null;atlasSession.correct=0;atlasSession.finished=false;atlasOpen(id,'quiz')}
});

// Pure, testable helper. Scored quizzes use three disjoint groups.
// Practice can run forever; within each practice round, no item repeats.
function selectExpeditionQuestions(bank,{practice=false,attempt=0,rng=Math.random}={}){
 if(!Array.isArray(bank)||bank.length<18)throw new Error('Assessment needs at least 18 questions');
 let questions;
 if(practice){
  const shuffled=bank.slice();
  for(let i=shuffled.length-1;i>0;i--){
   const j=Math.floor(rng()*(i+1));
   [shuffled[i],shuffled[j]]=[shuffled[j],shuffled[i]];
  }
  questions=shuffled.slice(0,6);
 }else{
  if(!Number.isInteger(attempt)||attempt<0||attempt>2)throw new Error('Scored attempts must be 0, 1, or 2');
  questions=bank.slice(attempt*6,attempt*6+6);
 }
 if(questions.length!==6||questions.some(q=>!q||typeof q.q!=='string'||!Array.isArray(q.o)||q.o.length!==4||!Number.isInteger(q.a)||q.a<0||q.a>=q.o.length)){
  throw new Error('Invalid question data');
 }
 return questions;
}

 recycle:{icon:'♻️',label:'Recycle correctly',unit:'kg / items',desc:'Materials separated for collection; processing is not verified.'},
 water:{icon:'💧',label:'Save water',unit:'estimated L',desc:'Estimate from flow rate × minutes of running water avoided.'},
 reuse:{icon:'🔄',label:'Repair / reuse',unit:'objects',desc:'Objects repaired, reused, shared or donated for reuse.'},
 cleanup:{icon:'🧤',label:'Collect litter',unit:'kg',desc:'Litter collected in a permitted and safe cleanup; not automatically recycled.'},
 mobility:{icon:'🚲',label:'Low-impact trip',unit:'km',desc:'Distance traveled by walking, cycling or transit; not an emissions estimate.'},
 volunteer:{icon:'🤝',label:'Volunteer',unit:'hours',desc:'Time contributed to a real environmental activity.'}
};
const BLUE_MATERIALS={aluminum:{label:'Aluminum',note:'When accepted and actually remelted, recycled aluminum can reduce demand for virgin aluminum production. Savings depend on local processing and energy.'},paper:{label:'Paper & cardboard',note:'Correctly recovered paper fiber may replace some virgin fiber. Avoid food contamination and follow local sorting guidance.'},plastic:{label:'Plastic',note:'Only locally accepted polymers may be recycled. Sorting plastic is not evidence that it has been processed.'},glass:{label:'Glass',note:'Glass can be remade when collection and processing systems accept it. Refillable schemes may offer additional benefits, depending on logistics.'},other:{label:'Other accepted material',note:'Always check the local recycling program. Material rejected by the facility is not counted as confirmed recycling.'}};
const BLUE_CHALLENGE=[
 ['MON','💧','Find one avoidable source of water waste.'],
 ['TUE','🛍️','Avoid an unnecessary purchase.'],
 ['WED','♻️','Check how to recycle one material locally.'],
 ['THU','🔄','Repair, reuse or share one object.'],
 ['FRI','🚲','Choose a lower-impact trip if it is safe and feasible.'],
 ['SAT','🐢','Learn about and help protect one local habitat.'],
 ['SUN','🤝','Find a trustworthy community project or volunteer opportunity.']
];
function blueEntries(){return Array.isArray(store.blueLog)?store.blueLog:[]}
function blueToday(){return localDate()}
function blueSum(kind,{day=null,unit=null}={}){return blueEntries().filter(r=>r.kind===kind&&(!day||r.date===day)&&(!unit||r.unit===unit)).reduce((n,r)=>n+Number(r.amount||0),0)}
function blueNum(n){return Number(n||0).toLocaleString('en-US',{maximumFractionDigits:2})}
function blueFirstWeek(){const d=new Date();d.setHours(12,0,0,0);const offset=(d.getDay()+6)%7;d.setDate(d.getDate()-offset);return [...Array(7)].map((_,i)=>{const t=new Date(d);t.setDate(d.getDate()+i);return [t.getFullYear(),String(t.getMonth()+1).padStart(2,'0'),String(t.getDate()).padStart(2,'0')].join('-')})}
function blueDateBadge(day){return day===blueToday()?'TODAY':day}

const BLUE_LITERS_PER_1000_US_GALLONS=3785.411784;
const BLUE_USD_FMT=new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'});
function blueUSD(value){return BLUE_USD_FMT.format(Number.isFinite(value)?value:0)}
function blueWaterRate(){const n=Number(store.blueWaterPriceUSD);return store.blueWaterPriceUSD!==null&&store.blueWaterPriceUSD!==undefined&&Number.isFinite(n)&&n>=0&&n<=500?n:null}
function blueEntrySavingsUSD(entry){
 if(entry.kind==='water'){
  const rate=blueWaterRate();
  return rate===null?0:Number(entry.amount||0)/BLUE_LITERS_PER_1000_US_GALLONS*rate;
 }
 if(!['reuse','mobility','skipbuy'].includes(entry.kind))return 0;
 return Number(entry.avoidedUSD||0)-Number(entry.spentUSD||0);
}
function blueSavings(records,date=null){
 const chosen=date?records.filter(r=>r.date===date):records;
 const water=chosen.filter(r=>r.kind==='water').reduce((n,r)=>n+blueEntrySavingsUSD(r),0);
 const habits=chosen.filter(r=>['reuse','mobility','skipbuy'].includes(r.kind)).reduce((n,r)=>n+blueEntrySavingsUSD(r),0);
 return {water,habits,total:water+habits};
}

function blueActionHub(){
 const records=blueEntries(),today=blueToday(),todays=records.filter(x=>x.date===today),days=blueFirstWeek();

 ${blueStudio()}
 <div class="section-head"><div><div class="soft-label">TODAY'S ACTION, NOT AN INVENTED FOOTPRINT</div><h2>What did you do today?</h2><p>These are your own entries for ${esc(today)}. They are not verified environmental outcomes.</p></div></div>
 <div class="blue-metrics">

 <div class="blue-metric"><div class="metric-glyph">💧</div><strong>${blueNum(todayWater)} <small style="display:inline;font-size:14px">L</small></strong><small>Potential running-water use avoided, estimated from your inputs</small></div>
 <div class="blue-metric"><div class="metric-glyph">🔄</div><strong>${blueNum(todayReuse)}</strong><small>Objects reused or repaired today</small></div>
 <div class="blue-metric"><div class="metric-glyph">🧤</div><strong>${blueNum(todayCleanup)} <small style="display:inline;font-size:14px">kg</small></strong><small>Litter collected today · separate from recycling</small></div>
 </div>
 <section class="blue-money-band" aria-label="Estimated money savings in US dollars">

   <div class="money-side"><small>ALL-TIME ESTIMATED SPENDING DIFFERENCE</small><div class="money-total">${blueUSD(allMoney.total)}</div><small>Negative totals mean extra spending, not savings. This is not a measured bill reduction. No automatic dollar value is assigned to recycling, litter collection or volunteer time.</small></div>
 </section>
 <div class="blue-panel blue-money-config"><div class="blue-eyebrow" style="color:#16838d">PERSONALIZE YOUR WATER VALUE</div><h3>What does your water cost?</h3><p>Enter the <b>variable</b> water + wastewater rate on your bill, if applicable, in USD per 1,000 US gallons. Leave it blank if unknown. Fixed fees do not count as savings.</p>
   <form id="blue-price-form"><div class="field"><label for="blue-water-rate">Marginal price (USD / 1,000 US gal)</label><input class="input" id="blue-water-rate" name="rate" inputmode="decimal" type="number" min="0" max="500" step="0.01" placeholder="Enter your actual bill rate" value="${moneyRate===null?'':moneyRate}"></div><button class="blue-dark-btn" type="submit">Update water rate</button></form>
   <p class="blue-money-micro">Calculation: estimated liters avoided ÷ 3,785.411784 × entered USD rate. Changing the rate recalculates past water entries. If you have not entered a rate, water savings are not included in the dollar total.</p>
 </div>
 <div class="blue-grid">
 <div class="blue-panel" id="blue-log"><div class="blue-eyebrow" style="color:#16838d">01 / LOG A REAL ACTION</div><h2>Make it count. Record it.</h2><p class="blue-muted">No account. No invented CO₂ totals. Your entries stay in this browser until you export or delete them.</p>
 <div class="blue-cats">${Object.entries(BLUE_KINDS).map(([id,x])=>`<button class="blue-cat" type="button" data-action="blueKind" data-id="${id}" aria-pressed="${ui.blueKind===id}"><span class="emoji">${x.icon}</span>${x.label}</button>`).join('')}</div>
 <form id="blue-action-form"><input type="hidden" name="kind" value="${esc(ui.blueKind)}"><div class="blue-form-grid">
 ${ui.blueKind==='recycle'?`<div class="field"><label for="blue-material">Which material?</label><select class="input" id="blue-material" name="material" required>${Object.entries(BLUE_MATERIALS).map(([id,m])=>`<option value="${id}" ${id===(ui.blueMaterial||'aluminum')?'selected':''}>${esc(m.label)}</option>`).join('')}</select></div><div class="field"><label for="blue-unit">How was it counted?</label><select class="input" id="blue-unit" name="unit"><option value="kg">Weight (kg)</option><option value="items">Individual items</option></select></div>`:''}
 ${ui.blueKind==='water'?`<div class="field"><label for="blue-flow">Water flow rate (L/min)</label><input class="input" type="number" id="blue-flow" name="flow" min="0.1" max="40" step="0.1" required placeholder="e.g., measured 6"></div><div class="field"><label for="blue-minutes">Minutes of running water avoided</label><input class="input" type="number" id="blue-minutes" name="minutes" min="0.1" max="180" step="0.1" required placeholder="e.g., 2"></div>`:`<div class="field"><label for="blue-amount">${ui.blueKind==='recycle'?'Quantity':ui.blueKind==='reuse'?'Objects reused or repaired':ui.blueKind==='skipbuy'?'Purchases avoided':ui.blueKind==='cleanup'?'Litter collected (kg)':ui.blueKind==='mobility'?'Trip distance (km)':'Volunteering time (hours)'}</label><input class="input" id="blue-amount" name="amount" type="number" min="0.01" max="100000" step="0.01" required placeholder="e.g., 1.5"></div>`}
 ${['reuse','skipbuy','mobility'].includes(ui.blueKind)?`<div class="field"><label for="blue-avoided-usd">Spending genuinely avoided (USD, total)</label><input class="input" type="number" min="0" max="100000" step="0.01" name="avoidedUSD" id="blue-avoided-usd" placeholder="Optional · e.g., 20.00"></div><div class="field"><label for="blue-spent-usd">Extra cost of this action (USD)</label><input class="input" type="number" min="0" max="100000" step="0.01" name="spentUSD" id="blue-spent-usd" placeholder="Optional · e.g., 4.00"></div>`:''}
 <div class="field"><label for="blue-date">Date</label><input class="input" type="date" name="date" id="blue-date" required value="${today}" max="${today}"></div>
 <div class="field"><label for="blue-method">Evidence quality</label><select class="input" name="method" id="blue-method"><option value="self_reported">Self-reported</option><option value="measured">Self-measured</option><option value="estimated">Estimated</option></select></div>
 <div class="field full"><label for="blue-note">What did you actually do? (optional)</label><input class="input" name="note" id="blue-note" maxlength="180" placeholder="e.g., weighed sorted cardboard for local pickup"></div>
 </div>
 <div class="blue-disclosure" style="margin:13px 0"><b>How we count this:</b> ${esc(explanatory)} ${ui.blueKind==='water'?'The calculator multiplies your supplied flow rate by the minutes you report avoiding; it is an estimate, not a utility-meter measurement.':''}</div>
 <div id="blue-live-preview" class="blue-preview" role="status" aria-live="polite"><div><b>LIVE PREVIEW · WHAT YOU ARE RECORDING</b><small data-blue-preview-amount>Enter your action details</small><small data-blue-preview-label>No money estimate for this activity</small></div><strong data-blue-preview-money>—</strong></div>
 <button class="blue-dark-btn" type="submit">＋ Save action in my field log</button></form></div>
 <div style="display:grid;gap:17px">
 <div class="blue-panel"><div class="blue-eyebrow" style="color:#16838d">02 / TODAY'S BLUE CHALLENGE</div><h2>${mission[1]} ${mission[0]} mission</h2><p>${esc(mission[2])}</p><button type="button" class="blue-dark-btn" data-action="blueMission">${missionDone?'✓ Marked done — undo':'I completed this action'}</button><p class="blue-muted" style="margin-top:11px">A checkmark is a personal reflection, not a measurement. Use the log to record quantities.</p></div>
 <div class="blue-panel"><div class="blue-eyebrow" style="color:#16838d">03 / THIS WEEK</div><h2>Your blue activity</h2><p class="blue-muted">${records.filter(r=>days.includes(r.date)).length} logged actions this week, all self-reported.</p><div class="blue-track-bars" aria-label="Actions recorded for the past seven calendar dates">${summary.map(n=>`<div class="bar" style="height:${Math.max(3,n/max*100)}%" title="${n} logged actions"></div>`).join('')}</div><div class="blue-track-days">${['M','T','W','T','F','S','S'].map(x=>`<span>${x}</span>`).join('')}</div><button class="blue-small-btn" data-action="blueExport" type="button" style="margin-top:15px" ${!records.length?'disabled':''}>↓ Export my actions (.csv)</button></div>
 </div></div>
 <div class="section-head" style="margin-top:30px"><div><div class="soft-label">LEARN THE IMPACT · WITHOUT GREENWASHING</div><h2>So, what does recycling actually change?</h2><p>Environmental benefits depend on collection, local acceptance, actual processing, energy source and whether recycled material replaces virgin production.</p></div></div>
 <div class="blue-facts"><div class="blue-fact"><b>♻️ Recycling is a process</b><p>Sorting a material is only the first step. Local facilities decide what is accepted and actually recycled. Check your municipality's rules.</p></div><div class="blue-fact"><b>💧 Water use is measurable</b><p>Tracking flow and time helps estimate avoided use. Real water savings require comparison with a credible baseline.</p></div><div class="blue-fact"><b>🐟 Healthy ecosystems need more</b><p>Waste prevention can reduce litter risk, but restoring an ecosystem requires long-term conservation, sound science and local stewardship.</p></div></div>
 <div class="blue-panel" style="margin-top:20px"><div style="display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap"><div><div class="blue-eyebrow" style="color:#16838d">FROM FIELD SCIENCE TO COMMUNITY ACTION</div><h2>What happens after your daily action?</h2><p class="blue-muted">WILD//US explains biological relationships; Think Blue helps you turn knowledge into responsible habits.</p></div><button class="btn dark" data-action="go" data-id="ecosystem">Explore a living ecosystem ↗</button></div><div class="blue-steps" style="margin:14px 0 10px">${BLUE_CHALLENGE.map(([day,emoji],i)=>`<div class="blue-step ${i===cIdx?'active':''} ${i===cIdx&&missionDone?'done':''}"><span class="day">${day}</span><span class="symbol">${emoji}</span><span class="state">${i===cIdx?(missionDone?'DONE':'TODAY'):'TRY IT'}</span></div>`).join('')}</div><div class="blue-disclosure"><b>THINK → ACT → PROTECT:</b> Choose a realistic habit. Log what you did. Support a vetted local conservation effort when possible. Donations should go directly through the organization's verified website; no money or personal contact information is collected here.</div></div>
 <div class="section-head" style="margin-top:28px"><div><div class="soft-label">YOUR PRIVATE BLUE FIELD LOG</div><h2>Recent actions</h2><p>Delete mistakes or export your notes anytime. All information stays on this device.</p></div></div>
 <div class="blue-panel" id="blue-history">${records.length?records.slice(0,30).map(r=>`<div class="blue-list-item"><div><b>${BLUE_KINDS[r.kind]?.icon||'🌎'} ${esc(BLUE_KINDS[r.kind]?.label||'Action')} · ${blueNum(r.amount)} ${esc(r.unit)}</b><p>${esc(r.date)} · ${esc(r.method.replaceAll('_',' '))}${r.material?' · '+esc(BLUE_MATERIALS[r.material]?.label||r.material):''}</p>${(r.kind==='water'&&moneyRate!==null)||['reuse','mobility','skipbuy'].includes(r.kind)?`<p><b>Estimated net savings: ${blueUSD(blueEntrySavingsUSD(r))}</b> · user-reported assumptions</p>`:''}${r.note?`<p>${esc(r.note)}</p>`:''}</div><button type="button" class="blue-small-btn" data-action="blueDelete" data-id="${esc(r.id)}" aria-label="Delete this logged action">Delete</button></div>`).join(''):'<div class="empty">Your impact journal is empty. Start with one honest action today.</div>'}</div>
 <p class="blue-source-note">Privacy & science note: Entries are stored only in your browser (localStorage), unless you export them. USD totals are estimates, not guaranteed reductions in bills; recycling has no automatic dollar value. Numbers above are user reports and simple arithmetic, not verified environmental outcomes, certified offsets, or proof of recycling. Do not record personal identifying details.</p>`;
}
function blueAddRecord(data){
 const kind=String(data.kind||'');if(!BLUE_KINDS[kind])throw new Error('Unknown action');
 const date=String(data.date||'');if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||date>blueToday()||date<'2020-01-01')throw new Error('Invalid action date');
 let amount,unit,material='';
 if(kind==='water'){
  const flow=Number(data.flow),min=Number(data.minutes);
  if(!Number.isFinite(flow)||flow<=0||flow>40||!Number.isFinite(min)||min<=0||min>180)throw new Error('Check the water rate and minutes');
  amount=Number((flow*min).toFixed(2));unit='L (estimated)';
 }else{
  amount=Number(data.amount);
  if(!Number.isFinite(amount)||amount<=0||amount>100000)throw new Error('Invalid quantity');if((['reuse','skipbuy'].includes(kind)||(kind==='recycle'&&data.unit==='items'))&&!Number.isInteger(amount))throw new Error('Count whole objects or items');
  if(kind==='recycle'){
   unit=data.unit==='items'?'items':'kg';material=String(data.material||'');if(!BLUE_MATERIALS[material])throw new Error('Select an accepted material');
  }else unit={reuse:'objects',skipbuy:'purchases',cleanup:'kg',mobility:'km',volunteer:'hours'}[kind];
 }
 const method=['self_reported','measured','estimated'].includes(data.method)?data.method:'self_reported';
 let avoidedUSD=0,spentUSD=0;
 if(['reuse','skipbuy','mobility'].includes(kind)){
  avoidedUSD=data.avoidedUSD===''||data.avoidedUSD==null?0:Number(data.avoidedUSD);
  spentUSD=data.spentUSD===''||data.spentUSD==null?0:Number(data.spentUSD);
  if(!Number.isFinite(avoidedUSD)||avoidedUSD<0||avoidedUSD>100000||!Number.isFinite(spentUSD)||spentUSD<0||spentUSD>100000){
   throw new Error('Use realistic USD amounts of $0 to $100,000');
  }
  avoidedUSD=Math.round(avoidedUSD*100)/100;
  spentUSD=Math.round(spentUSD*100)/100;
 }
 const item={id:'blue-'+Date.now()+'-'+Math.random().toString(36).slice(2,9),date,kind,amount,unit,material,method,avoidedUSD,spentUSD,note:String(data.note||'').trim().slice(0,180)};
 store.blueLog=blueEntries();store.blueLog.unshift(item);save();return item;
}
function blueCsvSafe(t){const v=String(t??'');return /^[\s]*[=+@\-]/.test(v)?"'"+v:v}
function blueExport(){const data=[['Date','Activity','Material','Quantity','Unit','Evidence type','Avoided spending USD','Extra expense USD','Estimated net savings USD','Notes'],...blueEntries().map(r=>[r.date,r.kind,r.material,r.amount,r.unit,r.method,r.avoidedUSD||0,r.spentUSD||0,blueEntrySavingsUSD(r).toFixed(2),blueCsvSafe(r.note)])];download('WILDUS-ThinkBlue-field-actions.csv',csv(data),'text/csv;charset=utf-8')}
const wildHomeBeforeBlue=home;
home=function(){const original=wildHomeBeforeBlue();return original.replace('<div class="section-head"><div><div class="soft-label">YOUR FIELD NOTES',`<div class="blue-home-call"><div><div class="blue-eyebrow">NEW · THINK BLUE × WILD//US</div><h3>Science meets real-world action. 🌊</h3><p>How much did you recycle today? Log your action, see your week, and learn what it can actually mean.</p></div><button class="btn primary" data-action="go" data-id="blue">Open Think Blue ↗</button></div><div class="section-head"><div><div class="soft-label">YOUR FIELD NOTES`)};
// Dedicated actions intentionally do not award conservation XP for unverifiable self-reports.
document.addEventListener('click',event=>{
 const b=event.target.closest('[data-action]');if(!b)return;
 if(b.dataset.action==='blueKind'){ui.blueKind=b.dataset.id;render();return}
 if(b.dataset.action==='blueMission'){const today=blueToday();store.blueMissions=store.blueMissions||{};if(store.blueMissions[today])delete store.blueMissions[today];else store.blueMissions[today]=BLUE_CHALLENGE[(new Date().getDay()+6)%7][0];save();sound('click');render();return}
 if(b.dataset.action==='blueExport'){blueExport();toast('Your field actions were exported.');return}
 if(b.dataset.action==='blueDelete'){if(!confirm('Delete this action from your private field log?'))return;store.blueLog=blueEntries().filter(x=>x.id!==b.dataset.id);save();render();toast('Action removed.');return}
});
document.addEventListener('submit',event=>{
 if(event.target.id==='blue-price-form'){
  event.preventDefault();
  const raw=new FormData(event.target).get('rate');
  const rate=raw===''?null:Number(raw);
  if(rate!==null&&(!Number.isFinite(rate)||rate<0||rate>500)){
   toast('Enter a rate between $0 and $500 per 1,000 US gallons.');return;
  }
  const draftForm=document.getElementById('blue-action-form');
  const draftFields=draftForm?Object.fromEntries(new FormData(draftForm).entries()):null;
  store.blueWaterPriceUSD=rate;save();render();
  if(draftFields){const f=document.getElementById('blue-action-form');if(f){for(const [key,value] of Object.entries(draftFields)){const el=f.elements.namedItem(key);if(el&&el.type!=='hidden')el.value=value;}bluePreviewUpdate();}}
  toast(rate===null?'Water rate cleared.':'Water rate updated. USD estimates recalculated.');return;
 }
 if(event.target.id!=='blue-action-form')return;
 event.preventDefault();
 try{const form=new FormData(event.target);const input=Object.fromEntries(form.entries());blueAddRecord(input);sound('correct');render();toast('Blue action saved. Thank you for logging honestly.');}
 catch(err){toast(err.message||'Check the action details.');}
});
document.addEventListener('change',event=>{if(event.target.id==='blue-material'){ui.blueMaterial=event.target.value;const b=document.querySelector('.blue-disclosure');if(b)b.innerHTML='<b>How we count this:</b> '+esc(BLUE_MATERIALS[ui.blueMaterial].note)}});

render();
})();
